---

- name: Restart nfs-config
  ansible.builtin.systemd_service:
    name: nfs-config
    state: restarted
    enabled: true
    masked: false
    daemon_reload: true
#  when: ansible_facts.distribution_major_version | int == 7

- name: Restart nfs-server
  ansible.builtin.systemd_service:
    name: nfs-server
    state: restarted
    enabled: true
    masked: false
    daemon_reload: true

- name: Restart nfs-kernel-server
  ansible.builtin.systemd_service:
    name: nfs-kernel-server
    state: restarted
    enabled: true
    masked: false
    daemon_reload: true

- name: Restart mountd
  ansible.builtin.systemd_service:
    name: nfs-mountd
    state: restarted
    enabled: true
    masked: false
    daemon_reload: true

- name: Reload nfs
  ansible.builtin.command: exportfs -ra
  changed_when: true
